version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      oapi-codegen:
        # The runtime must match the generator the notification client was
        # generated with (the tool directive in go.mod is commented out), so a
        # runtime bump may need the client regenerated by hand before merging.
        patterns:
          - "github.com/oapi-codegen/*"
      go-dependencies:
        # Everything else in one weekly pull request, so CI runs once per week
        # instead of once per dependency.
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      base-images:
        patterns:
          - "*"
