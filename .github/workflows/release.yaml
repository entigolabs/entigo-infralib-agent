name: Release

on:
  workflow_run:
    workflows: ["Stable"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/test.yaml
    secrets: inherit
  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # keyless cosign signing of the image
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Get latest release
        id: get_latest_release
        uses: actions/github-script@v9
        env:
          RELEASE_VERSION: ${{ vars.RELEASE_VERSION }}
        with:
          script: |
            const latestStableRelease = await github.rest.repos.getLatestRelease({ owner: context.repo.owner, repo: context.repo.repo });
            const currentMain =   await github.rest.repos.getBranch({ owner: context.repo.owner, repo: context.repo.repo, branch: "main" });
            const currentStable = await github.rest.repos.getCommit({ owner: context.repo.owner, repo: context.repo.repo, ref: 'refs/tags/' + latestStableRelease.data.tag_name });
            
            if (currentStable) {
              if (currentMain) {
                core.info('Latest main release commit: ' + currentStable.data.sha);
                core.info('Main branch commit: ' +  currentMain.data.commit.sha);
                if ( currentStable.data.sha != currentMain.data.commit.sha) {
                  
                  core.setOutput('new_release_needed', "true");
                  const versionString = '' + latestStableRelease.data.tag_name;
                  const regex = /^v(\d+)\.(\d+)\.(\d+).*$/;
                  const match = versionString.match(regex);
                  const major = parseInt(match[1], 10);
                  const minor = parseInt(match[2], 10);
                  const patch = parseInt(match[3], 10) + 1;
                  
                  const versionValue = process.env.RELEASE_VERSION;
                  let new_version;
                  if ( versionValue != `${major}.${minor}` ) {
                    core.info('Env var major and minor version differ from latest release, initializing new release! ' + versionValue + ' vs ' + major + '.' + minor);
                    new_version = `v${versionValue}.0`
                  } else {
                    new_version = `v${major}.${minor}.${patch}`
                  }
                  core.setOutput('new_version',  new_version);
                  core.setOutput('major_version',  `v${major}`);
                  core.info('Latest release is not the same as main branch, need to make a new release ' + new_version);
                } else {
                  core.info('Latest release is same as main branch, no need to make a new release');
                  core.setOutput('new_release_needed', "false");
                }
              } else {
                 core.setFailed('No main branch found');
              }
            } else {
              core.setFailed('No main releases found');
            }

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        if: ${{ steps.get_latest_release.outputs.new_release_needed == 'true' }}
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to Public ECR
        uses: docker/login-action@v4
        if: ${{ steps.get_latest_release.outputs.new_release_needed == 'true' }}
        with:
          registry: public.ecr.aws
          username: ${{ secrets.AWS_ACCESS_KEY_ID }}
          password: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        env:
          AWS_REGION: us-east-1

      - name: Login to Google AR
        uses: docker/login-action@v4
        if: ${{ steps.get_latest_release.outputs.new_release_needed == 'true' }}
        with:
          registry: europe-north1-docker.pkg.dev/entigo-infralib2/entigolabs/entigo-infralib-agent
          username: _json_key
          password: ${{ secrets.GCLOUDAR_JSON_KEY }}

      - name: Build and push image
        id: build
        if: ${{ steps.get_latest_release.outputs.new_release_needed == 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/arm64/v8,linux/amd64
          build-args: |
            GITHUB_SHA=${{ github.sha }}
            VERSION=${{ steps.get_latest_release.outputs.new_version }}
          sbom: true
          provenance: mode=max
          tags: |
            public.ecr.aws/entigolabs/entigo-infralib-agent:${{ steps.get_latest_release.outputs.new_version }}
            public.ecr.aws/entigolabs/entigo-infralib-agent:${{ steps.get_latest_release.outputs.major_version }}
            public.ecr.aws/entigolabs/entigo-infralib-agent:latest
            europe-north1-docker.pkg.dev/entigo-infralib2/entigolabs/entigo-infralib-agent:${{ steps.get_latest_release.outputs.new_version }}
            europe-north1-docker.pkg.dev/entigo-infralib2/entigolabs/entigo-infralib-agent:${{ steps.get_latest_release.outputs.major_version }}
            europe-north1-docker.pkg.dev/entigo-infralib2/entigolabs/entigo-infralib-agent:latest
            entigolabs/entigo-infralib-agent:${{ steps.get_latest_release.outputs.new_version }}
            entigolabs/entigo-infralib-agent:${{ steps.get_latest_release.outputs.major_version }}
            entigolabs/entigo-infralib-agent:latest

      # One build pushes the same multi-arch index to every registry, so they
      # share one digest. It is signed by digest in each with cosign keyless
      # signing (the certificate names this workflow, no key exists), and the
      # release notes get the registries, tags and digest.
      - name: Sign image
        if: ${{ steps.get_latest_release.outputs.new_release_needed == 'true' }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: "`${{ steps.get_latest_release.outputs.new_version }}`, `${{ steps.get_latest_release.outputs.major_version }}`, `latest`"
          ISSUER: https://token.actions.githubusercontent.com
          IDENTITY: ^https://github\.com/${{ github.repository }}/
        run: |
          set -euo pipefail
          {
            echo "## Container images"
            echo
            echo "One multi-arch image (linux/amd64, linux/arm64), signed with cosign, in every registry:"
            echo
            echo "| Image | Tags | Digest |"
            echo "| --- | --- | --- |"
          } > image-notes.md
          for image in entigolabs/entigo-infralib-agent public.ecr.aws/entigolabs/entigo-infralib-agent europe-north1-docker.pkg.dev/entigo-infralib2/entigolabs/entigo-infralib-agent; do
            cosign sign --yes "$image@$DIGEST"
            cosign verify --certificate-oidc-issuer "$ISSUER" --certificate-identity-regexp "$IDENTITY" "$image@$DIGEST" > /dev/null
            echo "| \`$image\` | $TAGS | \`$DIGEST\` |" >> image-notes.md
          done
          {
            echo
            echo "Verify the signature:"
            echo
            echo '```bash'
            echo "cosign verify --certificate-oidc-issuer $ISSUER \\"
            echo "  --certificate-identity-regexp '$IDENTITY' \\"
            echo "  public.ecr.aws/entigolabs/entigo-infralib-agent@$DIGEST"
            echo '```'
            echo
          } >> image-notes.md
          cat image-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Authenticate with GitHub CLI
        run: gh auth login --with-token <<< ${{ secrets.GITHUB_TOKEN }}
        if: ${{ steps.get_latest_release.outputs.new_release_needed == 'true' }}

      - name: Create Release
        id: create_release
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a ${{ steps.get_latest_release.outputs.new_version }} -m "Release ${{ steps.get_latest_release.outputs.new_version }}"
          git push origin ${{ steps.get_latest_release.outputs.new_version }}
          RELEASE_URL=$(gh release create ${{ steps.get_latest_release.outputs.new_version }} \
          --title "Release ${{ steps.get_latest_release.outputs.new_version }}" \
          --generate-notes \
          --notes-file image-notes.md \
          --draft=false \
          --latest=true \
          --prerelease=false)
          echo "RELEASE_URL=$RELEASE_URL" >> $GITHUB_ENV
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: ${{ steps.get_latest_release.outputs.new_release_needed == 'true' }}
